<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heavy Is the Haul — a heist game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #ui { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 8px; z-index: 2; }
  #ui button { font: 600 15px system-ui, sans-serif; color: #f2ead8; background: #241a33;
    border: 2px solid #c9962e; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  #ui button:hover { background: #332647; }
</style>
</head>
<body>
<canvas id="game" aria-label="Heavy Is the Haul: steal the giant golden heart from a tilting vault and drag it to the escape hatch"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="ui">
  <button id="btn-start" type="button">Start</button>
  <button id="btn-pause" type="button">Pause</button>
  <button id="btn-restart" type="button">Restart</button>
  <button id="btn-mute" type="button">Mute</button>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
